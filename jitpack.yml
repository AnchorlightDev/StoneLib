# Paper 26.2 ships Java 25 class files, so building against paper-api needs a JDK 25 to *read*
# them. JitPack's own JDK provisioning cannot supply Java 25: its `openjdk25` token points at an
# Oracle build Oracle has removed, and its bundled SDKMAN fails to download any Java 25 candidate.
# So we fetch an Eclipse Temurin 25 tarball directly from Adoptium, point JAVA_HOME at it, and
# build with the committed Maven wrapper. (Temurin emits Java 21 bytecode here per the pom's
# <release>21</release>; the JDK 25 is only needed to read paper-api's Java 25 class files.)
install:
  - curl -fsSL -o /tmp/jdk25.tar.gz "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse" && mkdir -p /tmp/jdk25 && tar -xzf /tmp/jdk25.tar.gz -C /tmp/jdk25 --strip-components=1
  - export JAVA_HOME=/tmp/jdk25 && export PATH="$JAVA_HOME/bin:$PATH" && java -version && ./mvnw -B -ntp clean install -DskipTests
